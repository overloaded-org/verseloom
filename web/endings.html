<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2e9"><title>律织 · 比较尾联</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="composition.css"><link rel="stylesheet" href="writing-desk.css"><script src="closure-app.js" defer></script><script src="closure-ready.js" defer></script>
<style>.desk .experiment .box{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:clamp(14px,3vw,24px);margin-top:16px}.experiment .setting-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.experiment .setting-row label{display:block;margin:0}.experiment #write,.experiment #stop{width:100%}.experiment #stop:not([hidden]){margin-top:8px}.experiment #status{margin-bottom:0}.experiment #prefix,.experiment #ending{font-size:clamp(22px,5.8vw,29px);line-height:1.7;letter-spacing:.08em;text-align:center;padding:12px 0}.experiment #prefix div:nth-child(2n+3){margin-top:8px}.experiment #ending{border-block:1px solid var(--line);color:#783f30;background:#f7f3e9}.experiment #modes{border:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:12px 0}.experiment #modes legend{padding:0 0 7px;font-size:14px;color:var(--muted)}.experiment #modes label{margin:0;min-height:46px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:14px;line-height:1.35;cursor:pointer}.experiment #modes input{margin:0;accent-color:var(--accent);width:16px;height:16px}.experiment #modes label:has(:checked){background:#eaf0e6;border-color:var(--accent)}.experiment .actions{display:flex;flex-wrap:wrap}.experiment #comparison{min-height:2.8em}.experiment #numbers{overflow-wrap:anywhere}</style></head>
<body class="desk" data-edition="mobile-writing-desk-v1"><header class="mast"><a href="induced.html" class="wordmark"><span class="seal" aria-hidden="true">律</span>律织 <small lang="en">VerseLoom</small></a><a class="back" href="induced.html">返回生成台</a></header>
<main class="desk-main experiment"><div class="desk-grid"><section class="controls"><p class="rubric">诗笺 ／ 尾联实验</p><h1>比较同一首诗的收尾</h1><p class="lede">前六句由程序写成。切换方法，只比较最后两句。</p>
<form class="box" id="form"><div class="setting-row"><label>诗体<select id="length"><option value="7">七言 · 八句</option><option value="5">五言 · 八句</option></select></label><label>随机种子<input type="text" id="seed" inputmode="numeric" maxlength="10" value="0" pattern="[0-9]{1,10}" required></label></div><label class="check"><input id="auto" type="checkbox" checked> 每次换种子</label><button type="submit" id="write" disabled>正在加载生成器…</button><button id="stop" type="button" class="quiet" hidden>停止计算</button><p id="status" role="status">正在准备生成界面。</p><noscript>请启用 JavaScript 以生成诗稿。</noscript></form></section>
<section id="sheet" class="sheet" tabindex="-1" hidden><p class="rubric">诗笺 ／ 正文</p><h2 id="title">本次诗稿</h2><div id="prefix"></div><div id="ending" aria-live="polite" aria-label="当前尾联"></div><fieldset id="modes"><legend>收尾方式</legend><label><input type="radio" name="arm" value="original">原搜索</label><label><input type="radio" name="arm" value="greedy">先定第七句</label><label><input type="radio" name="arm" value="joint">两句合选</label><label><input type="radio" name="arm" value="ordered" checked>合选＋前文顺序</label></fieldset><p id="comparison" class="small"></p><details class="fold"><summary>本次选择依据</summary><p id="numbers" class="small"></p><p>统计分不是文学分，不同方法也可能选中同一个尾联。</p></details><div class="actions"><button class="quiet" type="button" id="replay">原种子复现</button><button class="quiet" type="button" id="save">导出记录</button></div></section></div>
<details class="about fold"><summary>为什么比较尾联？</summary><p>逐句选可能在见到结尾前淘汰第七句。这里复用前六句、韵部、起式和合法候选，比较四种收尾方式。它是实验入口，不改变常规生成器的默认选择。</p><a href="https://github.com/overloaded-org/verseloom/tree/main/research/sp03-endings">实验方法</a></details></main><footer class="desk-foot">律织 VerseLoom <a href="NOTICE.html">数据来源</a></footer></body></html>
