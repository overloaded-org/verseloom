name: Learned continuation evidence
on:
  push:
    branches: [main]
    paths:
      - 'scripts/*continuation*'
      - 'scripts/diagnose_couplet_closure.py'
      - 'scripts/evaluate_middle_couplet.py'
      - 'scripts/build_induced_model.py'
      - 'tests_continuation/**'
      - 'web/continuation-*.js'
      - 'web/induced-*.js'
      - 'web/induced.html'
      - '.github/workflows/continuation.yml'
  pull_request:
    paths:
      - 'scripts/*continuation*'
      - 'scripts/build_induced_model.py'
      - 'tests_continuation/**'
      - 'web/continuation-*.js'
      - 'web/induced-*.js'
      - 'web/induced.html'
      - '.github/workflows/continuation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: continuation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      CONTINUATION_FIXTURES: output/continuation-v1/feature-fixtures.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Build pinned training statistics
        run: |
          python -m pip install -r requirements.txt
          python scripts/bootstrap_quality_data.py --download --cache output/continuation-source/cache --output output/continuation-source/run
          python scripts/build_induced_model.py --bootstrap output/continuation-source
      - name: Fit only training pairs and measure development retrieval
        run: |
          python scripts/train_continuation_ranker.py --corpus output/continuation-source/run/candidate_poems.jsonl --output output/continuation-v1
          python scripts/check_continuation_context.py --corpus output/continuation-source/run/candidate_poems.jsonl --experiment output/continuation-v1 --output output/continuation-v1/context-control.json
          python scripts/evaluate_middle_couplet.py --corpus output/continuation-source/run/candidate_poems.jsonl --output output/continuation-v1/sp02-middle-retrieval.json
      - name: Check isolation, math, provenance, rebuild and UI event contracts
        run: |
          python -m unittest discover -s tests_continuation -v
          node --test tests_continuation/*.test.cjs
      - name: Generate both arms with identical seeds and candidate budgets
        run: |
          node scripts/evaluate_continuation.cjs output/continuation-five 5
          node scripts/evaluate_continuation.cjs output/continuation-seven 7
          python scripts/audit_continuation_generation.py --ranker output/continuation-v1/ranker.json --input output/continuation-five/outputs.jsonl output/continuation-seven/outputs.jsonl --output output/continuation-v1/generation-audit.json
          python scripts/diagnose_couplet_closure.py --input output/continuation-five/outputs.jsonl output/continuation-seven/outputs.jsonl --output output/continuation-v1/sp02-couplet-closure.json
          git diff --exit-code
      - name: Preserve all evidence, including incomplete runs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: continuation-development-evidence
          path: |
            output/continuation-v1/
            output/continuation-five/
            output/continuation-seven/
          if-no-files-found: warn
          retention-days: 7
