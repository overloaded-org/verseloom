name: Live mobile writing desk
on:
  workflow_run:
    workflows: ['Browser demo and GitHub Pages']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install test browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps "$BROWSER"
      - name: Exercise the published writing desk
        env:
          BROWSER: ${{ matrix.browser }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python tests_mobile/live_writing_desk.py
      - if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: writing-desk-${{ matrix.browser }}
          path: output/live-desk/
          retention-days: 7
