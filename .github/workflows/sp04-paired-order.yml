name: SP04 paired-word-order replication
on:
  push:
    branches: [research/sp04-paired-order]
    paths: ['research/sp04/**', '.github/workflows/sp04-paired-order.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.13'}
      - name: Syntax and authenticated inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m py_compile research/sp04/*.py
          mkdir -p output/parent/{inputs,results} output/source output/wrap
          cp research/sp03/{study.py,protocol.json} output/parent/
          cd output/parent/inputs
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12965520106/zip" > VerseLoom_Quality_Data_v1.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13000647584/zip" > VerseLoom_SP02_Parallel_CI_Evidence.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13027920264/zip" > sp03.zip
          echo '1392dd9e03c7b6a2d80960697a4d5e174faccf9cfd975591b774ca548d50cd02  VerseLoom_Quality_Data_v1.zip' | sha256sum -c -
          echo 'daed684299a29742ce0c79d4ad3e0fcbf3a508cdc5c68cffde4858d27b4bc03b  VerseLoom_SP02_Parallel_CI_Evidence.zip' | sha256sum -c -
          echo '40879836fd1311fe2eff3575ad6575e9af8ffe7c2111221d156a6906a9632a37  sp03.zip' | sha256sum -c -
          unzip -p sp03.zip first/line-pairs.jsonl > ../results/line-pairs.jsonl
          unzip -p sp03.zip first/rerank.jsonl > ../results/rerank.jsonl
          unzip -q VerseLoom_Quality_Data_v1.zip -d ../../source
      - name: Rebuild pinned reference data
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
          python scripts/build_induced_model.py --bootstrap output/source
          tar -C web -cf output/wrap/artifact.tar ./induced-data.js
          (cd output/wrap && zip -q ../parent/inputs/verseloom-pages-1818d1e.zip artifact.tar)
      - name: Run, replay, check decisions and test meter-matched transfer
        run: |
          set -euo pipefail
          PYTHONHASHSEED=711 python research/sp04/experiment.py output/parent output/first
          PYTHONHASHSEED=887 python research/sp04/experiment.py output/parent output/replay
          python research/sp04/audit.py output/first output/parent output/replay | tee output/audit.json
          python research/sp04/meter_check.py output/parent output/first output/meter
          git diff --exit-code
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        if: always()
        with:
          name: sp04-paired-order-evidence
          path: |
            output/first/
            output/meter/
            output/audit.json
          retention-days: 14
          if-no-files-found: warn
