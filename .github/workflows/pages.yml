name: Browser demo and GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tests_web/**"
      - "scripts/build_web_*.py"
      - "scripts/check_live_site.cjs"
      - "src/wordconv_lab/free_generation.py"
      - "src/wordconv_lab/prosody.py"
      - "data/corpus_v03/poems.jsonl"
      - "data/reference_v02/pingshui_106_memberships.json"
      - "results/free_generation_v06_run001/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - "tests_web/**"
      - "scripts/build_web_*.py"
      - "scripts/check_live_site.cjs"
      - "src/wordconv_lab/free_generation.py"
      - "src/wordconv_lab/prosody.py"
      - "data/corpus_v03/poems.jsonl"
      - "data/reference_v02/pingshui_106_memberships.json"
      - "results/free_generation_v06_run001/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_enabled: ${{ steps.pages-state.outputs.enabled }}
      manifest_sha: ${{ steps.site-build.outputs.manifest_sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the frozen data-build dependency
        run: python -m pip install -r requirements.txt
      - name: Export browser data from frozen records
        run: |
          python scripts/build_web_data.py
          python scripts/build_web_data.py --check
      - name: Test browser generation
        run: node --test --test-isolation=none --test-reporter=spec tests_web/engine.test.cjs
      - name: Build the site and the offline HTML
        id: site-build
        run: |
          python scripts/build_web_demo.py --output _site
          echo "manifest_sha=$(sha256sum _site/build-manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Check Pages availability
        id: pages-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.has_pages')"
          case "$enabled" in
            true|false) ;;
            *) exit 1 ;;
          esac
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = "false" ]; then
            echo "### Browser demo verified; Pages setup is still required" >> "$GITHUB_STEP_SUMMARY"
            echo "Open Settings → Pages → Build and deployment → Source, select GitHub Actions, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
            echo "No site artifact was uploaded because Pages is disabled. The site and standalone.html can also be built locally. Repository visibility was not changed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the browser demo
        if: steps.pages-state.outputs.enabled == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
          retention-days: 1
      - name: Report uploaded artifact
        if: steps.upload.outcome == 'success'
        run: echo "The verified site and standalone.html were uploaded in the github-pages artifact. See the deploy job for publication status." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

  verify-live:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify live HTTP assets and generation engine
        shell: bash
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
        run: |
          node scripts/check_live_site.cjs | tee "$RUNNER_TEMP/live-site-check.json"
          echo '### Live HTTP assets and Node engine check' >> "$GITHUB_STEP_SUMMARY"
          echo 'This checks published bytes and generation, not browser UI interactions.' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/live-site-check.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
