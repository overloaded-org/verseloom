name: Import verified project archive

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-project.yml
      - .github/import_project.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verseloom-initial-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install frozen runtime dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Verify archive, test, audit, and import source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRANSFER_HELPER_SHA: 8c9a7b44661f730cdc5c25014ad29bac5e8d7249
          HOSTED_APPS_HELPER_SHA: 6273dafa0426c0cadd5f0edbdbdeeb59530a0507
          TRANSFER_BLOB_SHA: 354dbcb10b4d8c2f2d7d6af568e5174c9c13c19f
        run: python .github/import_project.py
