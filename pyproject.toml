[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "versematrix-lab"
version = "0.5.0"
description = "Auditable engineering harness for verse matrix and local convolution experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
wordconv-lab = "wordconv_lab.cli:main"
wordconv-complete = "wordconv_lab.completion_v05:main"

[tool.setuptools.packages.find]
where = ["src"]
